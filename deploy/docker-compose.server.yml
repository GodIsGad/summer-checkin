# ============================================================
# summer-checkin —— 服务器上真正运行的那份 compose（工作草稿）
# 落地位置：/srv/summer-checkin/docker-compose.yml
# 同目录还需要：nginx.conf、.env（见 env.server.example）
#
# 【为什么不能直接拿仓库里那份 docker-compose.yml 上来跑】
# 仓库那份是"在自己电脑上 clone + build"的写法。搬到你这台机上有三处必须改，
# 每处都是一条真实的部署常识，不是变通：
#
# 1 镜像来源。仓库里写 pgvector/pgvector:pg16、nginx:alpine、summer-checkin-app:latest。
#   前两个要连 Docker Hub（这台机实测 DNS 把 registry-1.docker.io 解析到过段 IP，
#   connection refused），第三个更是要本地 build 才存在——而这台机不能 build（1.8G）。
#   → 三个镜像全部来自 ACR，而且用 **-vpc 内网域名**：
#     它解析到 100.103.7.180（100.64/10 是阿里云内网段），同 VPC 内网直达，
#     不占你套餐的公网带宽，也不受公网质量影响。
#     公网域名 crpi-...cn-hangzhou 只留给 CI 往外推送，两边别填反。
#
# 2 端口。仓库里 nginx 绑 "80:80"，你这台机的 80/443 是 1Panel 自己的 OpenResty 在用，
#   直接绑会报 "port is already allocated"。
#   → 这一阶段绑 8080（所谓"学习形态"：能访问、但还不上正式入口）。
#   ⚠️ 8080 必须在 ECS 安全组里只放行你自己家的 IP/32。
#      现在这套代码的后台是"你还没改过密码的默认状态"，公网全开等于请人进来试。
#      1Panel 面板本身已经限过，这条是给新端口补的，不给它加就等于绕过前面的努力。
#
# 3 内存。仓库那份假设机器随便造；你只有 1.8G + 2G swap。
#   → 每个服务加 mem_limit。它不是"预留"，是护栏：某个进程疯了就杀它一个，
#     比它把整台机（连带 PostgreSQL）拖进 OOM 好排查得多。
#   三个上限合计 1.4G，稳态实际占用远小于它，起完用 docker stats 看真实数字。
#
# 【这一版故意没做的，知道就好，不算漏】
#   · postgres 不对外发布任何端口：prisma 相关命令全在 app 容器里跑，走容器内部网络
#     （少一个端口就少一个攻击面，这是默认姿势，不是偷懒）
#   · 没有 HTTPS / 自动备份 / 监控 —— 那是 Stage 5 以后的事
#   · 全机"一套 PG"的目标这里还没合（现在是本项目自带一个 pgvector 容器），
#     原因：1Panel 那套 PG 镜像不带 pgvector 扩展，而这个项目非它不可。
# ============================================================

name: summer-checkin

services:
  # ─────────────── 数据库：pgvector（PostgreSQL 16 + vector 扩展）───────────────
  postgres:
    image: ${ACR_VPC}/250827_test/pgvector-pg16:pg16
    container_name: sc-postgres
    restart: unless-stopped
    # 上游注释写的坑，照抄：这台机内核上 Docker 默认 seccomp 会拦 initdb 的 fork，
    # 报 "Cannot allocate memory"（很误导人，看着像内存不足，其实是系统调用被拦）。
    security_opt:
      - seccomp=unconfined
    environment:
      POSTGRES_USER: postgres
      # 这里刻意用最朴素的写法：变量没配就是空字符串，不报错。
      # 为什么不用 compose 那种"没配就拒绝启动"的强制插值语法（变量名后面跟冒号加问号）：
      # 实测它对跟在后面的文案字符很挑，两次把整行吃成非法变量名（invalid interpolation），
      # 而且第二次是我以为已经修好了、字节一看还是坏的。语法糖不可靠就退回朴素写法。
      # "密码必须非空"这条规矩改由部署前的预检负责：同目录 preflight.sh（只打印键名和长度，不打印值）。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: summer_checkin
    # 1.8G 的机器上 PG 只能当小弟：默认配置是按"独占一台大内存机"调的。
    # shared_buffers 128MB 足够自测；work_mem 小是因为排序/hash 是"每个连接每步"都算一份。
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=48MB
      - -c
      - max_connections=40
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d summer_checkin"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 400m
    networks:
      - app-network

  # ─────────────── 应用：Next.js 主进程 + WebSocket sidecar（同一个容器两个进程）───────────────
  app:
    image: ${ACR_VPC}/250827_test/summer-checkin-app:${APP_TAG:-latest}
    container_name: sc-app
    restart: unless-stopped
    # entrypoint 在 Dockerfile 里已经设过，这里重复一次是故意的：
    # 上游脚本是"后台起 sidecar、前台 exec node server.js"，
    # 写死在 compose 里能让你以后临时换成 `sh` 进去排查，不用重新 build 镜像。
    entrypoint: ["/app/docker-entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/summer_checkin
      # HOSTNAME 必须是 0.0.0.0：Next 默认只听 localhost，在容器里等于外面连不上。
      HOSTNAME: "0.0.0.0"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      # 这一项决定 better-auth 认为自己"在哪个站点上"，写错就会登录成功却不给 cookie。
      # 学习形态填 IP:8080；以后上域名 + HTTPS 要回来改成 https://域名（不带端口）。
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}
      # cron 接口的 Bearer 口令。⚠️ 仓库那份 compose 漏传了这个变量，
      # 代码里 process.env.CRON_SECRET 一定读得到 undefined → 那条鉴权直接形同虚设。
      # 这条已记在《BUG与风险清单》，fork 那边要修；这里先按正确姿势传上。
      CRON_SECRET: ${CRON_SECRET:-}
      # ---- AI 相关：决策③"先不接 AI"，所以这一组全留空也能跑 ----
      # 留空的后果只是"点 AI 功能的按钮报错"，不影响注册/登录/打卡/看板。
      ALIYUN_API_KEY: ${ALIYUN_API_KEY:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_MODEL: ${DASHSCOPE_MODEL:-agnes-2.5-flash}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://api.agnes-ai.cn/v1}
      AGNES_API_KEY: ${AGNES_API_KEY:-}
      AGNES_BASE_URL: ${AGNES_BASE_URL:-https://api.agnes-ai.cn/v1}
      AI_TOKEN_LIMIT: ${AI_TOKEN_LIMIT:-200000}
      # ---- OSS：头像/壁纸直传。不配就是"上传头像失败"，其余功能正常 ----
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_REGION: ${OSS_REGION:-}
      OSS_PUBLIC_BASE_URL: ${OSS_PUBLIC_BASE_URL:-}
      # V8 堆上限。sidecar 是另一个 node 进程，自己还要一份，
      # 所以真正可能吃到 2×448MB ≈ 900MB —— 这就是上面 mem_limit 给 900m 的依据。
      # 报 JavaScript heap out of memory 就先动这个数，别急着加内存条。
      NODE_OPTIONS: --max-old-space-size=448
    volumes:
      - knowledge_data:/app/knowledge
    # 不发布到宿主机：只有 nginx 从内部网络访问它（3000 主站 / 3001 WebSocket）
    expose:
      - "3000"
      - "3001"
    mem_limit: 900m
    networks:
      - app-network

  # ─────────────── 入口：nginx 反代（把 8080 转到 app 的 3000/3001）───────────────
  nginx:
    image: ${ACR_VPC}/250827_test/nginx-alpine:alpine
    container_name: sc-nginx
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      # 只读挂载：配置写死在宿主机的一个文件里，改完 `docker compose restart nginx` 就生效。
      # 为什么不给 nginx 单独 build 一个镜像把配置 COPY 进去？
      # 那每次改配置都要走一遍 CI + 推镜像，调一个 header 等五分钟，学习期没必要。
      # 正式项目里两种做法都对，取舍点就在这句话里。
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    mem_limit: 64m
    networks:
      - app-network

volumes:
  postgres_data:
  knowledge_data:

networks:
  app-network:
    driver: bridge
