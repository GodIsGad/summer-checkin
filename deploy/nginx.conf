# ============================================================
# summer-checkin —— 服务器上的 nginx 配置（学习形态精简版）
# 落地位置：/srv/summer-checkin/nginx.conf
#   compose 里以只读方式挂到容器内 /etc/nginx/conf.d/default.conf
#   （文件名不一样是故意的：nginx 官方镜像会 include conf.d/*.conf，
#     而仓库里那份的路径是 nginx/nginx.conf → default.conf，别搞混）
#
# 【和仓库那份 nginx/nginx.conf 的关系】
# 内容取自上游，只删掉了两类"这一阶段用不上、但会吃掉内存/让人看错重点"的东西：
#   · /_next/static 与图片音频文件的长缓存规则 —— 那是给真实用户省流量用的，
#     现在只有你自己访问，缓存头配错反而会让你以为"改了代码没生效"。
#   · access_log off 之类的日志降噪。
# 上游那份随时可以换回来，切换成本 = 改一个文件 + restart nginx。
# 真正不能删的是下面这两块里的 proxy_set_header —— 它们不是可选优化：
#   · Host：Next/better-auth 用它拼回调地址，删了会得到一个 http://app:3000 的跳转
#   · X-Forwarded-Proto：以后上 HTTPS 时，删了它应用会把自己的页面当成 http，
#     于是"重定向循环"（表现是浏览器一直转圈报 ERR_TOO_MANY_REDIRECTS）
# ============================================================

upstream nextjs {
    server app:3000;
    # 这里 app 是 compose 里的服务名，docker 内部 DNS 会解析成容器 IP。
    # 容器重建后 IP 会变，nginx 只在启动时解析一次 —— 所以 app 重建后要 restart nginx。
    # （这是这套 compose 里最"反直觉但常见"的一个坑，先记着，Stage 4 真的会遇到。）
}

upstream chatws {
    server app:3001;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    # ---- 主站 ----
    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 回答是流式（SSE）返回的。nginx 默认会缓冲响应，
        # 结果就是"AI 憋半天然后一次性吐出来"——功能没坏，体验全丢。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- WebSocket（聊天室 sidecar，独立进程监听 3001）----
    location /ws {
        proxy_pass http://chatws;
        proxy_http_version 1.1;
        # 这两行是 WebSocket 能起来的唯一原因：1.1 + upgrade 头。
        # 少了任何一条，浏览器握手会返回 400，
        # 而页面其他部分全都正常 —— 所以只看页面是看不出问题的，得看 Network 里那条 ws。
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
